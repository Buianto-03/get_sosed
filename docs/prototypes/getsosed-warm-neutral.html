#iris-wire .section{margin:42px 0}
#iris-wire .section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
#iris-wire .section-head h2{margin-bottom:0}
#iris-wire .hero-points{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin-top:22px;color:var(--iris-strong)}
#iris-wire .hero-points span{display:flex;align-items:center;gap:7px}
#iris-wire .quick-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:-4px}
#iris-wire .quick-row button{border-radius:24px;min-height:34px;padding:6px 13px;font-size:12px}
#iris-wire button.collection{display:flex;flex-direction:column;align-items:start;justify-content:start;text-align:left;padding:23px;border:1px solid var(--iris-line);border-radius:16px;background:var(--iris-paper);gap:7px}
#iris-wire button.collection:hover{background:var(--iris-fill)}
#iris-wire .collection&gt;span:not(.collection-icon):not(.collection-link){font-weight:400;color:var(--iris-muted)}
#iris-wire .collection-icon{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:12px;background:var(--iris-fill);color:var(--iris-strong);margin-bottom:10px}
#iris-wire .collection-link{color:var(--iris-strong);margin-top:13px}
#iris-wire .together{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--iris-fill);border-radius:22px;overflow:hidden}
#iris-wire .together-photo{background:var(--hero-img) center/cover;min-height:330px;display:flex;align-items:end;padding:20px}
#iris-wire .photo-caption{background:var(--iris-paper);padding:13px 18px;border-radius:12px;color:var(--iris-text)}
#iris-wire .together-copy{padding:32px;display:flex;flex-direction:column;align-items:start;justify-content:center;gap:12px}
#iris-wire .together-copy p{margin:0}
#iris-wire .together-copy .badge{background:var(--iris-paper)}
#iris-wire .together-copy button{margin-top:6px}
#iris-wire .how-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
#iris-wire .how-grid article{padding:20px 0;border-top:1px solid var(--iris-line)}
#iris-wire .step-mark{display:block;font-size:28px;letter-spacing:-1px;color:var(--iris-strong);margin-bottom:12px}
#iris-wire .faq-section,#iris-wire .discussion{display:grid;grid-template-columns:1fr 1.6fr;gap:36px}
#iris-wire details{border-bottom:1px solid var(--iris-line);padding:0 0 15px;margin-bottom:15px}
#iris-wire summary{cursor:pointer;padding:9px 0;color:var(--iris-text);font-weight:500}
#iris-wire details p{margin:7px 0 0;color:var(--iris-muted);line-height:1.65}
#iris-wire .owner-banner{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:30px;background:var(--iris-fill);border-radius:22px;margin:28px 0 8px}
#iris-wire .owner-banner p{color:var(--iris-muted);margin-bottom:0;max-width:450px}
#iris-wire .about-hero{padding:26px 0 12px;max-width:760px}
#iris-wire .about-hero h1{font-size:54px;line-height:1.08;letter-spacing:-2px}
#iris-wire .about-hero h1 em{font-style:normal;color:var(--iris-strong)}
#iris-wire .about-hero p{font-size:18px;color:var(--iris-muted);max-width:640px;margin:20px 0}
#iris-wire .about-story{display:grid;grid-template-columns:1fr 1.2fr;gap:32px;align-items:center}
#iris-wire .about-photo{min-height:370px;background:var(--hero-img) center/cover;border-radius:20px 60px 20px 20px}
#iris-wire .about-story p{line-height:1.75}
#iris-wire .audience-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
#iris-wire .audience{background:var(--iris-paper);border:1px solid var(--iris-line);border-radius:20px;padding:28px}
#iris-wire .audience ul{padding-left:18px;line-height:1.9;margin:20px 0}
#iris-wire .site-footer{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:24px;width:100%;align-items:start}
#iris-wire .site-footer nav{display:flex;flex-direction:column;align-items:start;gap:4px}
#iris-wire .site-footer h3{color:var(--iris-text);font-size:14px;margin-bottom:8px}
#iris-wire .site-footer button{font-size:12px;min-height:32px;padding:5px 0;text-align:left}
#iris-wire .footer-bottom{border-top:1px solid var(--iris-line);padding-top:16px;margin-top:18px;width:100%;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
#iris-wire .amenities{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:20px 0 26px}
#iris-wire .amenities span{display:flex;align-items:center;gap:9px;color:var(--iris-muted)}
@media(max-width:650px){#iris-wire .together,#iris-wire .how-grid,#iris-wire .faq-section,#iris-wire .discussion,#iris-wire .about-story,#iris-wire .audience-grid{grid-template-columns:1fr}#iris-wire .section{margin:32px 0}#iris-wire .together-photo,#iris-wire .about-photo{min-height:230px}#iris-wire .together-copy,#iris-wire .owner-banner,#iris-wire .audience{padding:22px}#iris-wire .about-hero h1{font-size:40px}#iris-wire .about-hero p{font-size:16px}#iris-wire .site-footer{grid-template-columns:1fr 1fr}#iris-wire .footer-intro{grid-column:1/-1}#iris-wire .hero-points{gap:10px;font-size:12px}#iris-wire .how-grid{gap:8px}#iris-wire .faq-section,#iris-wire .discussion{gap:16px}}

function faq(){return `&lt;div class=&quot;faq-list&quot;&gt;&lt;details&gt;&lt;summary&gt;Как найти жильё и познакомиться с соседом?&lt;/summary&gt;&lt;p&gt;Выбери город и бюджет, открой подходящее объявление и посмотри профиль автора. В чате можно обсудить условия, рассказать о себе и договориться о просмотре.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Что обсудить до переезда?&lt;/summary&gt;&lt;p&gt;Стоимость и залог, коммунальные платежи, график уборки, гостей, домашних животных и время тишины. Лучше заранее понять привычки друг друга.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Можно ли разместить свободную комнату?&lt;/summary&gt;&lt;p&gt;Да. Нажми «Объявление», расскажи о жилье, условиях и о себе, добавь фотографии и проверь публикацию. В этом прототипе объявление сохраняется только в демо.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Как сохранить понравившийся вариант?&lt;/summary&gt;&lt;p&gt;Нажми на сердце в карточке. Объявление появится в разделе «Избранное» твоего профиля — оттуда удобно вернуться к нему позже.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;`;}

function home(){return `&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Москва · Санкт-Петербург&lt;/div&gt;&lt;h1&gt;Твоё место. &lt;em&gt;Твои люди.&lt;/em&gt;&lt;/h1&gt;&lt;p class=&quot;muted&quot;&gt;Найди комнату и человека, с которым будет комфортно делить дом.&lt;/p&gt;&lt;div class=&quot;hero-points&quot;&gt;&lt;span&gt;&lt;i data-lucide=&quot;home&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Жильё под твой бюджет&lt;/span&gt;&lt;span&gt;&lt;i data-lucide=&quot;messages-square&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Знакомство до переезда&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${searchbar()}&lt;div class=&quot;quick-row&quot;&gt;&lt;span class=&quot;muted&quot;&gt;Быстрый поиск:&lt;/span&gt;&lt;button data-city=&quot;Москва&quot;&gt;Москва&lt;/button&gt;&lt;button data-city=&quot;Санкт-Петербург&quot;&gt;Санкт-Петербург&lt;/button&gt;&lt;button data-collection=&quot;pet&quot;&gt;Можно с котом&lt;/button&gt;&lt;/div&gt;&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Жильё + человек&lt;/div&gt;&lt;h2&gt;Здесь начинается твой новый дом&lt;/h2&gt;&lt;/div&gt;&lt;button class=&quot;link&quot; data-go=&quot;search&quot;&gt;Все объявления →&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;${base.map(card).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;${collections()}&lt;section class=&quot;section together&quot;&gt;&lt;div class=&quot;together-photo&quot; role=&quot;img&quot; aria-label=&quot;Общая гостиная в квартире&quot;&gt;&lt;span class=&quot;photo-caption&quot;&gt;Место для общих вечеров&lt;br&gt;и личного пространства&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;together-copy&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Больше, чем квадратные метры&lt;/div&gt;&lt;h2&gt;Хороший сосед —&lt;br&gt;это когда дома комфортно&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;У каждого свой ритм. Кто-то работает из дома, кто-то рано встаёт, а кто-то переезжает вместе с котом. Узнай о человеке до того, как делить с ним кухню.&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Привычки&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;Личное пространство&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;Общие правила&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; data-go=&quot;about&quot;&gt;Как устроен GETSOSED →&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Всё по шагам&lt;/div&gt;&lt;h2&gt;От первого поиска до знакомства&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;how-grid&quot;&gt;&lt;article&gt;&lt;span class=&quot;step-mark&quot;&gt;01&lt;/span&gt;&lt;h3&gt;Найди свой вариант&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Сравни цену, район, фотографии и условия совместной жизни.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;step-mark&quot;&gt;02&lt;/span&gt;&lt;h3&gt;Расскажи о себе&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Напиши автору, обсуди привычки и задай важные для тебя вопросы.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;step-mark&quot;&gt;03&lt;/span&gt;&lt;h3&gt;Встретьтесь лично&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Договоритесь о просмотре и решите, подходит ли вам жить вместе.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;section faq-section&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Поможем разобраться&lt;/div&gt;&lt;h2&gt;Частые вопросы&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Самое важное перед началом поиска.&lt;/p&gt;&lt;button class=&quot;link&quot; data-go=&quot;about&quot;&gt;Больше о сервисе →&lt;/button&gt;&lt;/div&gt;${faq()}&lt;/section&gt;&lt;section class=&quot;owner-banner&quot;&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Есть свободная комната?&lt;/span&gt;&lt;h2&gt;Твой будущий сосед&lt;br&gt function about(){return `&lt;div class=&quot;about-hero&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;О GETSOSED&lt;/div&gt;&lt;h1&gt;Дом начинается&lt;br&gt;&lt;em&gt;с людей&lt;/em&gt;&lt;/h1&gt;&lt;p&gt;Мы помогаем найти жильё для совместной аренды и познакомиться с будущим соседом ещё до переезда.&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;primary&quot; data-go=&quot;search&quot;&gt;Найти жильё →&lt;/button&gt;&lt;button data-go=&quot;post&quot;&gt;Предложить комнату&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;section class=&quot;section about-story&quot;&gt;&lt;div class=&quot;about-photo&quot; role=&quot;img&quot; aria-label=&quot;Светлая гостиная для совместного проживания&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Зачем мы здесь&lt;/div&gt;&lt;h2&gt;Арендовать вместе проще.&lt;br&gt;Жить вместе должно быть комфортно.&lt;/h2&gt;&lt;p&gt;Переезд — это не только новый адрес. Это новый район, новые привычки и люди, с которыми ты будешь встречаться на кухне каждый день.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;GETSOSED объединяет объявления о жилье, информацию об авторах и переписку в одном месте. Сервис задуман для студентов и молодых специалистов, которым важно разделить расходы на аренду и найти подходящее окружение.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Начинаем с Москвы и Санкт-Петербурга. В центре внимания — понятные условия и возможность договориться напрямую.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Что можно сделать&lt;/div&gt;&lt;h2&gt;Один сервис для двух сторон переезда&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;audience-grid&quot;&gt;&lt;article class=&quot;audience&quot;&gt;&lt;span class=&quot;collection-icon&quot;&gt;&lt;i data-lucide=&quot;search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;h2&gt;Я ищу жильё&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Выбирай комнату по городу и бюджету, сохраняй интересные варианты и знакомься с теми, кто уже там живёт.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Фотографии и условия в объявлении&lt;/li&gt;&lt;li&gt;Профиль будущего соседа&lt;/li&gt;&lt;li&gt;Избранное и личная переписка&lt;/li&gt;&lt;/ul&gt;&lt;button class=&quot;primary&quot; data-go=&quot;search&quot;&gt;Перейти к поиску →&lt;/button&gt;&lt;/article&gt;&lt;article class=&quot;audience&quot;&gt;&lt;span class=&quot;collection-icon&quot;&gt;&lt;i data-lucide=&quot;key-round&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;h2&gt;Я ищу соседа&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Размести свободную комнату, расскажи о своём ритме жизни и обсуди детали с заинтересовавшимися людьми.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Пошаговое создание объявления&lt;/li&gt;&lt;li&gt;Стоимость, фотографии и описание&lt;/li&gt;&lt;li&gt;Знакомство до личной встречи&lt;/li&gt;&lt;/ul&gt;&lt;button data-go=&quot;post&quot;&gt;Разместить объявление →&lt;/button&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Наш подход&lt;/div&gt;&lt;h2&gt;Что делает совместную жизнь лучше&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;how-grid&quot;&gt;&lt;article&gt;&lt;span class=&quot;collection-icon&quot;&gt;&lt;i data-lucide=&quot;receipt-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;h3&gt;Понятные условия&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Цена, залог и бытовые договорённости должны быть ясны до переезда.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;collection-icon&quot;&gt;&lt;i data-lucide=&quot;handshake&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;h3&gt;Уважение к различиям&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;У людей разные привычки. Важно обсудить их и найти комфортные общие правила.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;span class=&quot;collection-icon&quot;&gt;&lt;i data-lucide=&quot;message-circle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;h3&gt;Живое общение&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Хорошее описание помогает выбрать, а разговор — понять друг друга.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;section discussion&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Перед просмотром&lt;/div&gt;&lt;h2&gt;Начните с простого разговора&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Четыре темы, которые помогут понять, подходите ли вы друг другу.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;conversation-list&quot;&gt;&lt;details open&gt;&lt;summary&gt;Как проходит обычный день?&lt;/summary&gt;&lt;p&gt;Обсудите работу из дома, время подъёма и сна, музыку и общую тишину.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Как делить бытовые дела?&lt;/summary&gt;&lt;p&gt;Договоритесь об уборке, общих покупках и использовании кухни.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Как относитесь к гостям и питомцам?&lt;/summary&gt;&lt;p&gt;Проговорите частоту визитов, ночёвки и правила для животных.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Какие расходы будут каждый месяц?&lt;/summary&gt;&lt;p&gt;Уточните аренду, коммунальные услуги, интернет, залог и условия выезда.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;section faq-section&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Вопросы о сервисе&lt;/div&gt;&lt;h2&gt;Как это работает?&lt;/h2&gt;&lt;/div&gt;${faq()}&lt;/section&gt;&lt;section class=&quot;owner-banner&quot;&gt;&lt;div&gt;&lt;h2&gt;Найди место, где тебе хорошо&lt;/h2&gt;&lt;p&gt;Начни с города, бюджета и первого знакомства.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; data-go=&quot;search&quot;&gt;Посмотреть объявления →&lt;/button&gt;&lt;/section&gt;`;}

function search(){let found=all().filter(x=&gt;(state.city===&#x27;Все города&#x27;||x.city===state.city)&amp;&amp;(!state.budget||x.price&lt;=Number(state.budget))&amp;&amp;(!state.smoke||x.tags.includes(&#x27;Без курения&#x27;))&amp;&amp;(!state.pet||x.tags.includes(&#x27;Можно с котом&#x27;)));if(state.sort===&#x27;cheap&#x27;)found.sort((a,b)=&gt;a.price-b.price);if(state.sort===&#x27;expensive&#x27;)found.sort((a,b)=&gt;b.price-a.price);return `&lt;h1&gt;Найди своё место&lt;/h1&gt;${searchbar()}&lt;div class=&quot;row between&quot;&gt;&lt;div class=&quot;row&quot;&gt;&lt;button data-action=&quot;filters&quot; aria-expanded=&quot;${state.filter}&quot;&gt;Настроить фильтры ${state.filter?&#x27;−&#x27;:&#x27;+&#x27;}&lt;/button&gt;${state.smoke?&#x27;&lt;span class=&quot;badge&quot;&gt;Без курения&lt;/span&gt;&#x27;:&#x27;&#x27;}${state.pet?&#x27;&lt;span class=&quot;badge&quot;&gt;Можно с котом&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;button class=&quot;link&quot; data-action=&quot;reset&quot;&gt;Сбросить&lt;/button&gt;&lt;/div&gt;${state.filter?`&lt;form id=&quot;iris-filters&quot; class=&quot;panel filterbox&quot;&gt;&lt;h3&gt;Совместная жизнь&lt;/h3&gt;&lt;div class=&quot;row&quot;&gt;&lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;smoke&quot; ${state.smoke?&#x27;checked&#x27;:&#x27;&#x27;}&gt;Без курения&lt;/label&gt;&lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;pet&quot; ${state.pet?&#x27;checked&#x27;:&#x27;&#x27;}&gt;Можно с котом&lt;/label&gt;&lt;button class=&quot;primary&quot; type=&quot;button&quot; data-submit=&quot;true&quot;&gt;Показать варианты&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;`:&#x27;&#x27;}&lt;div class=&quot;row between resultbar&quot;&gt;&lt;span role=&quot;status&quot;&gt;Найдено: ${found.length}&lt;/span&gt;&lt;label&gt;Сортировка&lt;select id=&quot;iris-sort&quot;&gt;&lt;option value=&quot;recommended&quot; ${state.sort===&#x27;recommended&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;По умолчанию&lt;/option&gt;&lt;option value=&quot;cheap&quot; ${state.sort===&#x27;cheap&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Сначала дешевле&lt;/option&gt;&lt;option value=&quot;expensive&quot; ${state.sort===&#x27;expensive&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Сначала дороже&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;${found.length?`&lt;div class=&quot;grid&quot;&gt;${found.map(card).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&lt;div class=&quot;panel empty&quot;&gt;&lt;h2&gt;Пока нет подходящих вариантов&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Увеличь бюджет или убери часть фильтров.&lt;/p&gt;&lt;button data-action=&quot;reset&quot;&gt;Показать все объявления&lt;/button&gt;&lt;/div&gt;&#x27;}`;}
function detail(){const x=chosen();return `&lt;button class=&quot;link&quot; data-go=&quot;search&quot;&gt;← К результатам поиска&lt;/button&gt;&lt;div class=&quot;row between screenheading&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div&gt;&lt;h1&gt;${esc(x.title)}&lt;/h1&gt;&lt;span class=&quot;muted&quot;&gt;${esc(x.city)} · м. ${esc(x.metro)} · ${x.walk} минут пешком&lt;/span&gt;&lt;/div&gt;&lt;button data-save=&quot;${x.id}&quot; aria-pressed=&quot;${state.saved.includes(x.id)}&quot;&gt;${state.saved.includes(x.id)?&#x27;♥ Сохранено&#x27;:&#x27;♡ Сохранить&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;gallery&quot;&gt;${photo(&#x27;Комната · главное фото&#x27;)}&lt;div class=&quot;stack&quot;&gt;${photo(&#x27;Общая кухня&#x27;)}${photo(&#x27;Общая гостиная&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;section&gt;&lt;div class=&quot;facts&quot;&gt;&lt;span&gt;${esc(x.area)} м² · комната&lt;/span&gt;&lt;span&gt;2 соседа в квартире&lt;/span&gt;&lt;span&gt;С ${esc(x.date)}&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;С кем ты будешь жить&lt;/h2&gt;&lt;div class=&quot;person&quot;&gt;&lt;span class=&quot;avatar&quot;&gt;${esc(x.letter)}&lt;/span&gt;&lt;div&gt;${esc(x.name)}, ${x.age}&lt;br&gt;&lt;small&gt;${esc(x.job)}&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px&quot;&gt;${esc(x.about)}&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;${x.tags.map(t=&gt;`&lt;span class=&quot;badge&quot;&gt;${esc(t)}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;hr class=&quot;rule&quot;&gt;&lt;h2&gt;О жилье&lt;/h2&gt;&lt;p&gt;Отдельная комната, общая кухня и гостиная. Есть рабочее место, стиральная машина и интернет. Ищем соседа на длительный срок.&lt;/p&gt;&lt;h3&gt;Что есть в квартире&lt;/h3&gt;&lt;div class=&quot;amenities&quot;&gt;&lt;span&gt;&lt;i data-lucide=&quot;wifi&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Интернет&lt;/span&gt;&lt;span&gt;&lt;i data-lucide=&quot;laptop&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Рабоче function correspondent(){return all().find(x=&gt;x.id===(state.chatSelected||1))||base[0];}
function chat(){const x=correspondent(),messages=state.messages[x.id]||[];return `&lt;h1&gt;Сообщения&lt;/h1&gt;&lt;div class=&quot;two sidebar&quot;&gt;&lt;aside class=&quot;stack&quot;&gt;&lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;person&quot; style=&quot;margin:0&quot;&gt;&lt;span class=&quot;avatar&quot;&gt;${esc(x.letter)}&lt;/span&gt;&lt;div&gt;${esc(x.name)}&lt;br&gt;&lt;small&gt;${esc(x.title)}&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;hr class=&quot;rule&quot;&gt;&lt;small&gt;${esc(x.city)} · ${money(x.price)} ₽ / месяц&lt;/small&gt;&lt;button class=&quot;wide&quot; style=&quot;margin-top:15px&quot; data-detail=&quot;${x.id}&quot;&gt;Открыть объявление&lt;/button&gt;&lt;/div&gt;&lt;small&gt;Демонстрационный диалог&lt;/small&gt;&lt;/aside&gt;&lt;section class=&quot;panel&quot;&gt;&lt;div class=&quot;row between&quot;&gt;&lt;h3&gt;${esc(x.name)}&lt;/h3&gt;&lt;span class=&quot;badge&quot;&gt;Обсуждение просмотра&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;chatlog&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;message&quot;&gt;Привет! Комната пока свободна. Расскажи немного о себе и когда хочешь заехать.&lt;br&gt;&lt;small&gt;Сегодня, 10:30&lt;/small&gt;&lt;/div&gt;${messages.map(m=&gt;`&lt;div class=&quot;message me&quot;&gt;${esc(m)}&lt;br&gt;&lt;small&gt;Отправлено в прототипе&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;row&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;button data-quick=&quot;Можно посмотреть комнату в выходные?&quot;&gt;Договориться о просмотре&lt;/button&gt;&lt;button data-quick=&quot;Расскажи, пожалуйста, какие у вас правила дома?&quot;&gt;Уточнить правила&lt;/button&gt;&lt;/div&gt;&lt;form id=&quot;iris-message&quot; class=&quot;sendbar&quot;&gt;&lt;input name=&quot;message&quot; aria-label=&quot;Сообщение&quot; placeholder=&quot;Напиши сообщение…&quot; required maxlength=&quot;500&quot;&gt;&lt;button class=&quot;primary&quot; type=&quot;button&quot; data-submit=&quot;true&quot;&gt;Отправить →&lt;/button&gt;&lt;/form&gt;&lt;/section&gt;&lt;/div&gt;`;}
function account(){return `&lt;div class=&quot;row between screenheading&quot;&gt;&lt;h1&gt;Мой профиль&lt;/h1&gt;&lt;button data-go=&quot;post&quot;&gt;+ Разместить объявление&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;two sidebar&quot;&gt;&lt;aside class=&quot;panel stack&quot;&gt;&lt;div class=&quot;person&quot; style=&quot;margin:0&quot;&gt;&lt;span class=&quot;avatar&quot;&gt;${esc(state.profile.name[0]||&#x27;А&#x27;)}&lt;/span&gt;&lt;h3&gt;${esc(state.profile.name)}&lt;/h3&gt;&lt;/div&gt;${state.editing?`&lt;form id=&quot;iris-profile&quot; class=&quot;stack&quot;&gt;&lt;label&gt;Имя&lt;input name=&quot;name&quot; required maxlength=&quot;40&quot; value=&quot;${esc(state.profile.name)}&quot;&gt;&lt;/label&gt;&lt;label&gt;О себе&lt;textarea name=&quot;about&quot; maxlength=&quot;300&quot;&gt;${esc(state.profile.about)}&lt;/textarea&gt;&lt;/label&gt;&lt;button class=&quot;primary&quot; type=&quot;button&quot; data-submit=&quot;true&quot;&gt;Сохранить профиль&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;edit&quot;&gt;Отмена&lt;/button&gt;&lt;/form&gt;`:`&lt;p class=&quot;muted&quot;&gt;${esc(state.profile.about)}&lt;/p&gt;&lt;button data-action=&quot;edit&quot;&gt;Изменить профиль&lt;/button&gt;`}&lt;/aside&gt;&lt;section&gt;&lt;div class=&quot;tabs&quot; aria-label=&quot;Разделы профиля&quot;&gt;&lt;button data-tab=&quot;saved&quot; aria-pressed=&quot;${state.tab===&#x27;saved&#x27;}&quot;&gt;Избранное · ${state.saved.length}&lt;/button&gt;&lt;button data-tab=&quot;mine&quot; aria-pressed=&quot;${state.tab===&#x27;mine&#x27;}&quot;&gt;Мои объявления&lt;/button&gt;&lt;button data-go=&quot;chat&quot;&gt;Сообщения →&lt;/button&gt;&lt;/div&gt;${state.tab===&#x27;saved&#x27;?(state.saved.length?`&lt;div class=&quot;grid&quot; style=&quot;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))&quot;&gt;${all().filter(x=&gt;state.saved.includes(x.id)).map(card).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&lt;div class=&quot;panel empty&quot;&gt;&lt;h2&gt;Сохрани то, что понравилось&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Нажми на сердце рядом с объявлением.&lt;/p&gt;&lt;button data-go=&quot;search&quot;&gt;Перейти к поиску&lt;/button&gt;&lt;/div&gt;&#x27;):(state.published?`&lt;span class=&quot;badge&quot;&gt;Опубликовано в прототипе&lt;/span&gt;&lt;div style=&quot;max-width:320px;margin-top:15px&quot;&gt;${card(state.published)}&lt;/div&gt;`:&#x27;&lt;div class=&quot;panel empty&quot;&gt;&lt;h2&gt;Здесь будет твоё объявление&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Найди соседа для свободной комнаты.&lt;/p&gt;&lt;button class=&quot;primary&quot; data-go=&quot;post&quot;&gt;Создать объявление&lt;/button&gt;&lt;/div&gt;&#x27;)}&lt;/section&gt;&lt;/div&gt;`;}
function post(){const d=state.draft,step=state.step;return `&lt;div class=&quot;formpage&quot;&gt;&lt;div class=&quot;row between&quot;&gt;&lt;h1&gt;Найдём тебе соседа&lt;/h1&gt;&lt;button class=&quot;link&quot; data-go=&quot;account&quot;&gt;Закрыть&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;steps&quot;&gt;${[&#x27;Жильё&#x27;,&#x27;Условия&#x27;,&#x27;Фото&#x27;,&#x27;Проверка&#x27;].map((t,i)=&gt;`&lt;span class=&quot;${step===i?&#x27;current&#x27;:&#x27;&#x27;}&quot;&gt;&lt;b class=&quot;number&quot;&gt;${i+1}&lt;/b&gt;${t}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;form id=&quot;iris-post&quot; class=&quot;panel&quot;&gt;&lt;div id=&quot;iris-error&quot; role=&quot;alert&quot;&gt;&lt;/div&gt;${step===0?`&lt;h2&gt;Расскажи о комнате&lt;/h2&gt;&lt;div class=&quot;fields&quot;&gt;&lt;label class=&quot;full&quot;&gt;Заголовок&lt;input name=&quot;title&quot; value=&quot;${esc(d.title)}&quot; required maxlength=&quot;70&quot; placeholder=&quot;Например: светлая комната у парка&quot;&gt;&lt;/label&gt;&lt;label&gt;Город&lt;select name=&quot;city&quot;&gt;&lt;option ${d.city===&#x27;Москва&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Москва&lt;/option&gt;&lt;option ${d.city===&#x27;Санкт-Петербург&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Санкт-Петербург&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Ближайшее метро&lt;input name=&quot;metro&quot; value=&quot;${esc(d.metro)}&quot; required placeholder=&quot;Название станции&quot;&gt;&lt;/label&gt;&lt;label&gt;Площадь комнаты, м²&lt;input type=&quot;number&quot; name=&quot;area&quot; min=&quot;1&quot; max=&quot;200&quot; value=&quot;${esc(d.area)}&quot; required&gt;&lt;/label&gt;&lt;/div&gt;`:step===1?`&lt;h2&gt;Цена и совместная жизнь&lt;/h2&gt;&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;Цена за месяц, ₽&lt;input name=&quot;price&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;1000000&quot; value=&quot;${esc(d.price)}&quot; required&gt;&lt;/label&gt;&lt;label&gt;Залог, ₽&lt;input name= &lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);

      return;
    }

      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }

    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
