name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Установить зависимости сервера
        working-directory: server
        run: npm ci

      - name: Проверить типы сервера
        working-directory: server
        run: npm run typecheck

      - name: Запустить тесты сервера
        working-directory: server
        run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Установить зависимости клиента
        working-directory: client
        run: npm ci

      - name: Проверить код клиента
        working-directory: client
        run: npm run lint

      - name: Запустить тесты клиента
        working-directory: client
        run: npm test

      - name: Собрать клиент
        working-directory: client
        run: npm run build

  docker-client:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Собрать образ клиента
        run: docker build -t get-sosed-client:ci -f client/Dockerfile client

  docker-server:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Собрать образ сервера
        run: docker build -t get-sosed-server:ci -f server/Dockerfile server

      - name: Проверить зависимости в образе сервера
        run:
          docker run --rm get-sosed-server:ci node -e "require('express');
          require('sharp'); require('bcrypt'); console.log('Пакеты загружены')"

      - name: Проверить Compose-конфигурацию
        run: docker compose --profile tools config --quiet

  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Запустить PostgreSQL
        run: docker compose up -d db

      - name: Дождаться PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U learner -d get-sosed; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL не начал принимать подключения"
          exit 1

      - name: Применить миграции
        run: docker compose run --rm --build migrate

      - name: Запустить сервер
        run: docker compose up -d --build server

      - name: Запустить клиент
        run: docker compose up -d --build client

      - name: Проверить API через Nginx
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --max-time 5 \
            --output "$RUNNER_TEMP/api-adverts.json" \
            http://127.0.0.1:8082/api/adverts

          python3 -c 'import json, sys; data = json.load(open(sys.argv[1])); assert data == [], f"Ожидался пустой список, получено: {data}"; print("API вернул пустой JSON-массив")' \
            "$RUNNER_TEMP/api-adverts.json"

      - name: Посмотреть запуск сервера и клиента
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=50 server client

      - name: Проверить страницу React
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:8082/listings \
            | grep --quiet 'id="root"'
          echo "Nginx вернул HTML-основу React"

      - name: Проверить маршруты изображений и WebSocket
        run: |
          image_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8082/images/ci-nonexistent.webp)
          ws_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8082/ws)

          echo "Несуществующее изображение: HTTP $image_status"
          echo "Обычный HTTP-запрос к WebSocket: HTTP $ws_status"

          test "$image_status" = 404
          test "$ws_status" = 426

      - name: Показать состояние и логи при ошибке
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=50 db server client

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/initial'
    needs: [server, client, docker-client, docker-server, compose-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Войти в GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Собрать образы для публикации
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          docker build \
            --tag "ghcr.io/$owner/get-sosed-client:$GITHUB_SHA" \
            --file client/Dockerfile \
            client

          docker build \
            --tag "ghcr.io/$owner/get-sosed-server:$GITHUB_SHA" \
            --file server/Dockerfile \
            server

      - name: Проверить собранные образы
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          docker run --rm \
            "ghcr.io/$owner/get-sosed-server:$GITHUB_SHA" \
            node -e "require('express'); require('sharp'); require('bcrypt'); console.log('Пакеты загружены')"

          docker run --rm \
            --add-host server:127.0.0.1 \
            "ghcr.io/$owner/get-sosed-client:$GITHUB_SHA" \
            nginx -t

      - name: Проверить работу собранных образов
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export CI_CLIENT_IMAGE="ghcr.io/$owner/get-sosed-client:$GITHUB_SHA"
          export CI_SERVER_IMAGE="ghcr.io/$owner/get-sosed-server:$GITHUB_SHA"
          export COMPOSE_FILE="compose.yaml:compose.ci-images.yaml"

          docker compose up --detach db

          ready=false
          for attempt in {1..30}; do
            if docker compose exec --no-TTY db pg_isready --username learner --dbname get-sosed; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "PostgreSQL не начал принимать подключения"
            exit 1
          fi

          docker compose run --rm --build migrate
          docker compose up --detach --no-build server
          docker compose up --detach --no-build client

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --max-time 5 \
            --output "$RUNNER_TEMP/publish-api.json" \
            http://127.0.0.1:8082/api/adverts

          python3 -c 'import json, sys; data = json.load(open(sys.argv[1])); assert data == [], f"Ожидался пустой список, получено: {data}"; print("API вернул пустой JSON-массив")' \
            "$RUNNER_TEMP/publish-api.json"

      - name: Опубликовать проверенные образы
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          docker image push "ghcr.io/$owner/get-sosed-client:$GITHUB_SHA"
          docker image push "ghcr.io/$owner/get-sosed-server:$GITHUB_SHA"