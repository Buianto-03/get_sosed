<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>
    <script
      src="https://api-maps.yandex.ru/v3/?apikey=2955bf46-ac2f-4eeb-86ca-2434442ed867&lang=ru_RU"
      type="text/javascript"
    ></script>
  </head>
  <body style="
    margin: 0;
    padding: 0;
    background-color: #fafafa; /* Основной цвет фона */
    background-image: url('https://img.freepik.com/free-vector/white-abstract-background_23-2148814882.jpg'); /* URL изображения фона */
    background-size: cover; /* Изображение будет масштабироваться для покрытия всего фона */
    background-repeat: no-repeat; /* Запрещает повторение изображения */
    background-attachment: fixed; /* Закрепляет фон, чтобы он не прокручивался */
  ">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
